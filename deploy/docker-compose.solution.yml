# Local, private-bucket replacement workflow. For production use managed S3
# and terminate HTTPS in front of playbackd; see docs/solution.md.
name: transmux-solution

x-runtime: &runtime
  image: transmux-solution:latest
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: runtime

x-store-env: &store-env
  AWS_ACCESS_KEY_ID: transmuxdemo
  AWS_SECRET_ACCESS_KEY: ${TRANSMUX_S3_SECRET_KEY:?Run make solution-env}
  AWS_REGION: us-east-1

x-publisher: &publisher
  <<: *runtime
  entrypoint: ["/sbin/tini", "--", "ffmpeg"]
  depends_on:
    - mediamtx
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128

services:
  # S3-compatible stand-in for the private bucket. RustFS (Apache-2.0) is
  # used because it pulls anonymously and implements the conditional writes
  # (If-None-Match: *, If-Match) that leases, manifest fencing and the
  # roster depend on. The image is pinned by digest.
  s3:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_ACCESS_KEY: transmuxdemo
      RUSTFS_SECRET_KEY: ${TRANSMUX_S3_SECRET_KEY:?Run make solution-env}
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - s3-data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 30

  # Creates the bucket and removes any bucket policy, so it stays private.
  # Uses the server image's curl with SigV4 instead of a separate client.
  s3-init:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: transmuxdemo
      S3_SECRET_KEY: ${TRANSMUX_S3_SECRET_KEY:?Run make solution-env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        bucket=http://s3:9000/transmux
        # Credentials go through stdin so they never appear in argv. The curl
        # config syntax needs " and \ escaped inside a quoted value and has
        # no way to carry a line break, so such credentials are refused.
        nl='
        '
        cr=$$(printf '\r')
        case "$$S3_ACCESS_KEY$$S3_SECRET_KEY" in
          *"$$nl"*|*"$$cr"*) echo "S3 credentials must not contain line breaks"; exit 1 ;;
        esac
        esc() { printf '%s' "$$1" | sed 's/[\\"]/\\&/g'; }
        s3() { printf 'user = "%s:%s"\n' "$$(esc "$$S3_ACCESS_KEY")" "$$(esc "$$S3_SECRET_KEY")" |
               curl -sS -K - --aws-sigv4 "aws:amz:us-east-1:s3" -o /dev/null -w '%{http_code}' "$$@"; }
        code=$$(s3 -I "$$bucket")
        [ "$$code" = 200 ] || { code=$$(s3 -X PUT "$$bucket"); [ "$$code" = 200 ] || { echo "create bucket: HTTP $$code"; exit 1; }; }
        code=$$(s3 -X DELETE "$$bucket?policy")
        case "$$code" in 200|204|404) ;; *) echo "remove bucket policy: HTTP $$code"; exit 1 ;; esac
        code=$$(curl -sS -o /dev/null -w '%{http_code}' "$$bucket?list-type=2")
        [ "$$code" = 403 ] || { echo "anonymous list returned HTTP $$code, expected 403"; exit 1; }
        echo "bucket transmux ready (private)"

  mediamtx:
    image: bluenviron/mediamtx:1.21.0
    volumes:
      - ./mediamtx.solution.yml:/mediamtx.yml:ro

  camera-entrance:
    <<: *publisher
    command:
      - -nostdin
      - -hide_banner
      - -loglevel
      - error
      - -re
      - -f
      - lavfi
      - -i
      - testsrc2=size=640x360:rate=10
      - -f
      - lavfi
      - -i
      - sine=frequency=660:sample_rate=48000
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -g
      - "20"
      - -sc_threshold
      - "0"
      - -b:v
      - 1000k
      - -c:a
      - aac
      - -b:a
      - 64k
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/entrance

  camera-warehouse:
    <<: *publisher
    command:
      - -nostdin
      - -hide_banner
      - -loglevel
      - error
      - -re
      - -f
      - lavfi
      - -i
      - testsrc2=size=640x360:rate=10
      - -f
      - lavfi
      - -i
      - sine=frequency=440:sample_rate=8000
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -g
      - "80"
      - -sc_threshold
      - "0"
      - -b:v
      - 1000k
      - -c:a
      - pcm_mulaw
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/warehouse

  camera-hevc:
    <<: *publisher
    command:
      - -nostdin
      - -hide_banner
      - -loglevel
      - error
      - -re
      - -f
      - lavfi
      - -i
      - testsrc2=size=320x180:rate=10
      - -f
      - lavfi
      - -i
      - sine=frequency=880:sample_rate=8000
      - -c:v
      - libx265
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -x265-params
      - pools=1:frame-threads=1:log-level=error
      - -g
      - "20"
      - -c:a
      - pcm_mulaw
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/hevc

  transmuxd:
    <<: *runtime
    stop_grace_period: 45s
    depends_on:
      s3-init:
        condition: service_completed_successfully
      mediamtx:
        condition: service_started
    environment: *store-env
    volumes:
      - ../configs/solution-ingest.json:/etc/transmux/config.json:ro
      - ingest-state:/var/lib/transmux/state
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    tmpfs:
      - /run/transmux/spool:size=256m,mode=0750,uid=10001,gid=10001
      - /tmp:size=16m,mode=1777
    ulimits:
      nofile: {soft: 65535, hard: 65535}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/livez"]
      interval: 5s
      timeout: 3s
      retries: 10

  playbackd:
    <<: *runtime
    entrypoint: ["/sbin/tini", "--", "/usr/local/bin/playbackd"]
    command: ["-config", "/etc/transmux/playback.json"]
    stop_grace_period: 30s
    depends_on:
      s3-init:
        condition: service_completed_successfully
    environment:
      <<: *store-env
      TRANSMUX_AUTH_SECRET: ${TRANSMUX_AUTH_SECRET:?Run make solution-env}
      TRANSMUX_ADMIN_PASSWORD: ${TRANSMUX_ADMIN_PASSWORD:?Run make solution-env}
      TRANSMUX_VIEWER_PASSWORD: ${TRANSMUX_VIEWER_PASSWORD:?Run make solution-env}
      TRANSMUX_PUBLIC_URL: ${TRANSMUX_PUBLIC_URL:-http://localhost:8090}
    volumes:
      - ../configs/solution-ingest.json:/etc/transmux/config.json:ro
      - ../configs/solution-playback.json:/etc/transmux/playback.json:ro
      - playback-state:/var/lib/transmux/playback
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "127.0.0.1:${TRANSMUX_HTTP_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8090/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  s3-data:
  ingest-state:
  playback-state:
