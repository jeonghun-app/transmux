# Keep the original ingest-only PoC and dependency scan on a schedule.
# CI also runs the authenticated solution stack and browser checks.
name: nightly

on:
  schedule:
    # 18:00 UTC = 03:00 KST.
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poc:
    name: end-to-end PoC stack
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make poc-up
      # The verifier waits for both media publication and channel health.
      - run: make poc-verify
      - name: transmuxd logs
        if: always()
        run: docker compose -f deploy/docker-compose.poc.yml logs --no-color transmuxd
      - name: tear down
        if: always()
        run: make poc-down

  vuln:
    name: dependency and module checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make vuln

# Not here, deliberately: scripts/measure-capacity.sh and
# scripts/measure-cpu.sh. They report absolute memory and CPU per channel and
# extrapolate to a production host. A shared 2-4 vCPU hosted runner produces
# numbers dominated by contention, and publishing a wrong capacity figure is
# worse than publishing none. Run them on a dedicated host; see
# docs/capacity-model.md for the environment the current figures came from.
