# Publish a release when a v* tag is pushed: static linux/amd64 and
# linux/arm64 binaries, SHA256SUMS, an SPDX SBOM, a GitHub Release whose notes
# come from CHANGELOG.md, and a multi-arch image on ghcr.io.
#
# Published versions are immutable. A version that already has a GitHub
# Release, or whose image was built from a different commit, is refused; fix
# forward with the next patch version. Re-running a failed run for the same
# commit is allowed and simply finishes the missing pieces. Releases are never
# drafted by hand; this workflow is the only thing that creates them. The
# repository's tag ruleset additionally forbids moving or deleting v* tags.
#
# Every job starts with no token permissions and asks only for what it uses.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

# Never cancel a half-published release; a second push of the same tag waits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything that can reject the release runs here, before anything is
  # published: the tag format, the CHANGELOG section and an existing release.
  prepare:
    name: validate tag, notes and prior release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      # Strict SemVer without build metadata. The tag name flows into make,
      # file names, image tags and ldflags, so nothing else is accepted.
      - id: tag
        name: validate tag
        run: |
          # A prerelease identifier is a number without leading zeros or an
          # alphanumeric string with at least one letter or hyphen.
          id='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          re="^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-${id}(\.${id})*)?$"
          if [[ ! "$GITHUB_REF_NAME" =~ $re ]]; then
            echo "::error::tag is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Only commits that have landed on main are released, so a tag pushed on
      # an unreviewed branch commit cannot publish anything.
      - name: require the tagged commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on origin/main"
            exit 1
          fi
      # Notes are the CHANGELOG section for this version (heading
      # "## [0.2.0] - date"). A tag without a section fails here, which is
      # deliberate: the changelog is the release's source of truth.
      - name: extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p tmp
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            /^\[[^]]+\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md > tmp/notes.md
          if ! grep -q '[^[:space:]]' tmp/notes.md; then
            echo "::error file=CHANGELOG.md::no '## [$version]' section"
            exit 1
          fi
      - name: refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .html_url 2>&1); then
            echo "::error::release $GITHUB_REF_NAME already exists: $out"
            exit 1
          fi
          if ! grep -q 'HTTP 404' <<<"$out"; then
            echo "$out"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: tmp/notes.md
          if-no-files-found: error
          retention-days: 7

  binaries:
    name: binaries, checksums and SBOM
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # VERSION is the validated tag, so `transmuxd -version` prints e.g. v0.2.0.
      - name: build release archives
        run: make dist VERSION="$GITHUB_REF_NAME"
      # The SBOM is generated from the built binaries rather than the source
      # tree, so it lists exactly the Go modules linked into what ships and
      # not the browser-test npm packages.
      - name: unpack amd64 binaries for SBOM scan
        run: |
          mkdir -p tmp/sbom-input
          tar -xzf "tmp/dist/transmux_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C tmp/sbom-input
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: tmp/sbom-input
          format: spdx-json
          output-file: tmp/dist/transmux_${{ github.ref_name }}_sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: checksums
        working-directory: tmp/dist
        run: |
          sha256sum -- *.tar.gz *.spdx.json > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: tmp/dist/
          if-no-files-found: error
          retention-days: 7

  image:
    name: container image
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only the runtime stage's apk install runs under emulation; Go
      # cross-compiles on the native builder (see deploy/Dockerfile).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A re-run for the same commit may overwrite its own image; an image of
      # this version built from any other commit is never replaced.
      #
      # Before the first release the package does not exist, and ghcr then
      # answers the registry token request with 403 rather than "not found".
      # So the packages API decides first: 404 means never published; any
      # other API error fails.
      - name: refuse to replace an image from another commit
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          ref="${IMAGE,,}:${GITHUB_REF_NAME}"
          package="${GITHUB_REPOSITORY#*/}"
          package="${package,,}"
          case "$(gh api "/users/$OWNER" --jq .type)" in
            User) scope=users ;;
            Organization) scope=orgs ;;
            *) echo "::error::cannot determine the owner type of $OWNER"; exit 1 ;;
          esac
          if ! api=$(gh api "/$scope/$OWNER/packages/container/$package" --jq .name 2>&1); then
            if ! grep -q 'HTTP 404' <<<"$api"; then
              echo "$api"
              exit 1
            fi
            # Never published as far as this token can see. If the registry
            # can still show the tag, check it below anyway; otherwise go on.
            if ! docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "package $OWNER/$package not published yet"
              exit 0
            fi
          fi
          if ! cfg=$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}' 2>/tmp/inspect.err); then
            # Proceed only when the registry says this tag has no manifest:
            # buildx reports that as exactly "ERROR: <ref>: not found", and a
            # registry may answer MANIFEST_UNKNOWN. Anything else (auth,
            # network, a missing tool) fails closed.
            if grep -qxF "ERROR: $ref: not found" /tmp/inspect.err ||
               grep -qiE '(^|[^a-z_])manifest[ _]unknown' /tmp/inspect.err; then
              echo "$ref not published yet"
              exit 0
            fi
            cat /tmp/inspect.err
            exit 1
          fi
          # A single-platform image is one config object; an index is a map of
          # platform to config (attestation manifests are not included). Every
          # platform must carry this commit's revision.
          revs=$(jq -c '[if has("config") then .config else .[].config end
                         | .Labels["org.opencontainers.image.revision"] // ""]' <<<"$cfg")
          if ! jq -e --arg sha "$GITHUB_SHA" 'length > 0 and all(.[]; . == $sha)' <<<"$revs" >/dev/null; then
            echo "::error::$ref has revisions $revs, not $GITHUB_SHA; publish a new version instead"
            exit 1
          fi
          echo "$ref already built from $GITHUB_SHA on every platform; re-run will overwrite it"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 -> 1.2.3, 1.2, 1, v1.2.3 and latest. A pre-release such as
          # v1.2.3-rc.1 gets only 1.2.3-rc.1 and v1.2.3-rc.1, never latest.
          # No floating major tag while on 0.x, where a minor bump may break.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=ref,event=tag
          flavor: |
            latest=${{ needs.prepare.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=transmux
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          push: true

  release:
    name: GitHub Release
    needs: [prepare, binaries, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: tmp/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: tmp
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          prerelease=()
          if [ "$PRERELEASE" = true ]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "transmux $GITHUB_REF_NAME" \
            --notes-file tmp/notes.md \
            "${prerelease[@]}" \
            tmp/dist/*
