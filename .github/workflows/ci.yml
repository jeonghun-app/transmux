# Go and ffmpeg checks use the same container targets as local development.
# The solution job additionally tests the real operator UI in Chromium.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet, test, race, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: make fmt-check
      - run: make vet
      - run: make test
      # The race detector needs cgo, which the target arranges itself.
      - run: make race
      - run: make build

  config:
    name: validate the checked-in config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: make image
      # -validate returns before ffmpeg is probed or anything is dialled, so
      # this is a pure schema check. It matters because unknown keys are a
      # startup error: a typo in an example config would break users, not
      # silently fall back to a default.
      - name: transmuxd -validate configs/poc.json
        run: |
          docker run --rm -v "$PWD/configs:/c:ro" transmux:latest \
            -config /c/poc.json -validate
      - name: validate solution configurations
        run: |
          docker run --rm \
            -v "$PWD/configs/solution-ingest.json:/etc/transmux/config.json:ro" \
            transmux:latest -validate
          docker run --rm --entrypoint /usr/local/bin/playbackd \
            -v "$PWD/configs/solution-ingest.json:/etc/transmux/config.json:ro" \
            -v "$PWD/configs/solution-playback.json:/etc/transmux/playback.json:ro" \
            transmux:latest -validate

  ffmpeg:
    name: tests that need a real ffmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # Tagged tests synthesise H.264/H.265 and AAC/G.711 inputs, then
      # decode the resulting HLS and MP4. No external camera is needed.
      - run: make test-ffmpeg

  solution:
    name: private storage, playback and operator UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: make solution-up
      - run: python3 scripts/verify-solution.py --restart
      - run: npm ci
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: npm test
        working-directory: tests/browser
      - name: service logs
        if: always()
        run: |
          docker compose --env-file .env.solution \
            -f deploy/docker-compose.solution.yml logs --no-color transmuxd playbackd
      - name: UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solution-screenshots
          path: |
            tests/browser/artifacts/*.png
            tests/browser/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: tear down isolated test data
        if: always()
        run: |
          docker compose --env-file .env.solution \
            -f deploy/docker-compose.solution.yml down -v
