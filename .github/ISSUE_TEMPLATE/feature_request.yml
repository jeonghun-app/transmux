name: 기능 제안
description: 해결할 문제와 제안하는 동작을 설명한다.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 사용 사례와 현재 겪는 어려움을 적는다.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결책
      description: 기대하는 동작과 범위를 적는다.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
      description: 다른 방법과 선택하지 않은 이유를 적는다.
    validations:
      required: false
